# Import .env file
spring.config.import=optional:file:.env[.properties]

spring.application.name=myelga-notification-service

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# RabbitMQ connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:myelga_app}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Notification queue
rabbitmq.notification.queue=notification.email.queue

# SMTP Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# External URLs
myelga.frontend.login-url=https://myelga.com/login